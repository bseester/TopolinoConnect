<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Topolino gösterge paneli</title>
  <desc id="desc">Referans fotoğraftaki Topolino gösterge panelinin vektörel çizimi: D vitesi, 34 km/h, batarya yüzde 75 ve 18999 km odometre.</desc>
  <defs>
    <radialGradient id="glass" cx="50%" cy="26%" r="78%">
      <stop offset="0" stop-color="#101417"/>
      <stop offset=".7" stop-color="#050708"/>
      <stop offset="1" stop-color="#010203"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#33383b"/>
      <stop offset=".12" stop-color="#111517"/>
      <stop offset=".82" stop-color="#050708"/>
      <stop offset="1" stop-color="#282d30"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f3ffff"/>
      <stop offset="1" stop-color="#c9e6eb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e5fbff"/>
      <stop offset=".38" stop-color="#7adfff"/>
      <stop offset="1" stop-color="#208acb"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff5960"/><stop offset="1" stop-color="#c71927"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="ticks" fill="url(#blue)" stroke="#98efff" stroke-opacity=".34" stroke-width="1">
      <path d="M0 0l48 24-7 12-49-25z"/><path d="M-14 19l48 24-7 12-49-25z"/>
      <path d="M-28 38l48 24-7 12-49-25z"/><path d="M-42 57l48 24-7 12-49-25z"/>
      <path d="M-56 76l48 24-7 12-49-25z"/><path d="M-70 95l48 24-7 12-49-25z"/>
    </g>
    <g id="digit3" fill="url(#lit)">
      <path d="M8 0h86l-10 13H17z"/><path d="M98 7h13v54l-14 9z"/>
      <path d="M95 77h14v53l-14 9z"/><path d="M17 137h78l-10 13H8z"/>
      <path d="M98 151h13v49l-14 9z"/><path d="M17 207h78l-10 13H8z"/>
      <path d="M8 77h14v53l-14 9z" opacity=".12"/>
    </g>
    <g id="digit4" fill="url(#lit)">
      <path d="M8 7h14v61l-14 9z"/><path d="M25 68h83v14H25z"/>
      <path d="M96 7h14v61l-14 9z"/><path d="M96 84h14v116l-14 9z"/>
      <path d="M8 137h14v63l-14 9z" opacity=".12"/>
    </g>
  </defs>

  <!-- Instrument visor and curved display, isolated from the steering wheel -->
  <path d="M110 300Q118 182 246 111Q600-28 954 111Q1082 182 1090 300L1073 510Q1055 600 934 633Q600 691 266 633Q145 600 127 510Z" fill="#000" opacity=".45"/>
  <path d="M105 295Q112 174 241 101Q600-37 959 101Q1088 174 1095 295L1078 493Q1064 581 944 614Q600 675 256 614Q136 581 122 493Z" fill="url(#rim)" stroke="#454b4e" stroke-width="7"/>
  <path d="M130 292Q137 190 259 126Q600 1 941 126Q1063 190 1070 292L1054 480Q1041 551 928 580Q600 636 272 580Q159 551 146 480Z" fill="url(#glass)" stroke="#080b0d" stroke-width="7"/>
  <path d="M205 157Q600 22 995 157" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="18"/>

  <!-- Topolino wordmark -->
  <text x="600" y="204" text-anchor="middle" fill="#d8e4e7" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" letter-spacing="1.2">TOPOLINO</text>

  <!-- Symmetric blue chevron scales -->
  <g opacity=".98">
    <path d="M320 258L205 330L320 412" fill="none" stroke="#172c3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M880 258L995 330L880 412" fill="none" stroke="#172c3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M302 280L230 328L302 378" fill="none" stroke="#8ddfff" stroke-opacity=".72" stroke-width="3"/>
    <path d="M898 280L970 328L898 378" fill="none" stroke="#8ddfff" stroke-opacity=".72" stroke-width="3"/>
    <g transform="translate(302 286) rotate(34)"><use href="#ticks"/></g>
    <g transform="translate(898 286) scale(-1 1) rotate(34)"><use href="#ticks"/></g>
    <path d="M197 395l38 5-23 18-39-6z" fill="url(#red)"/>
    <path d="M1003 395l-38 5 23 18 39-6z" fill="url(#red)" opacity=".28"/>
  </g>

  <!-- Gear and segmented digital speed -->
  <text x="600" y="283" text-anchor="middle" fill="#e4f3f5" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">D</text>
  <g transform="translate(464 306) scale(.78)" filter="url(#glow)"><use href="#digit3"/></g>
  <g transform="translate(580 306) scale(.78)" filter="url(#glow)"><use href="#digit4"/></g>
  <text x="600" y="490" text-anchor="middle" fill="#b7c7ca" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1.1">KM/H</text>

  <!-- Small lower-left dashboard symbols and battery value -->
  <g transform="translate(205 476)" fill="none" stroke="#d8e7e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 22h12l8-10h20l8 10h7v14H2z"/>
    <circle cx="14" cy="38" r="4" fill="#d8e7e9" stroke="none"/><circle cx="44" cy="38" r="4" fill="#d8e7e9" stroke="none"/>
  </g>
  <g transform="translate(183 535)" fill="none" stroke="#e2edef" stroke-width="3.5" stroke-linejoin="round">
    <rect x="0" y="5" width="24" height="15" rx="3"/><path d="M24 9h5v7h-5"/>
    <path d="M12 7l-4 7h5l-2 5 7-8h-5l2-4" fill="#e2edef" stroke="none"/>
  </g>
  <text x="225" y="556" fill="#edf7f8" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="400">75</text>
  <text x="271" y="556" fill="#aab9bc" font-family="Arial, Helvetica, sans-serif" font-size="18">%</text>

  <!-- Odometer block at lower right -->
  <text x="932" y="493" text-anchor="middle" fill="#819195" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.5">ODO</text>
  <text x="932" y="542" text-anchor="middle" fill="#e4edef" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" letter-spacing="1.3">18999</text>
  <text x="1000" y="543" fill="#acbabe" font-family="Arial, Helvetica, sans-serif" font-size="15">km</text>
</svg>
