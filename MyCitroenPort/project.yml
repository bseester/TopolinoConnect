name: MyCitroenPort
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
schemes:
  MyCitroenPort:
    build:
      targets:
        MyCitroenPort: all
    management:
      shared: true
      orderHint: 0
  MyCitroenPortWatch:
    build:
      targets:
        MyCitroenPortWatch: all
    run:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
      orderHint: 1
targets:
  MyCitroenPort:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MyCitroenPortApp.swift
      - path: Sources
      - path: AppIcons.xcassets
      - path: assets
        type: folder
        buildPhase: resources
    dependencies:
      - target: MyCitroenPortWidget
        embed: true
      - target: MyCitroenPortWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.topolinoconnect.mycitroenport
        PRODUCT_NAME: MyCitroen Test
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MyCitroenPortWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WidgetExtension
      - path: Sources/WidgetSnapshotStore.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetExtension.entitlements
        INFOPLIST_FILE: WidgetExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.topolinoconnect.mycitroenport.widget
        PRODUCT_NAME: MyCitroenVehicleWidget
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"

  MyCitroenPortWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: WatchApp/Assets.xcassets
      - path: Sources/WatchVehicleSnapshot.swift
    settings:
      base:
        INFOPLIST_FILE: WatchApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: local.topolinoconnect.mycitroenport.watchkitapp
        PRODUCT_NAME: My FIAT Watch
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
